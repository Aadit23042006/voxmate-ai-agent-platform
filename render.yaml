services:
  - type: web
    name: voxmate-genai-capstone
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health

    envVars:
      - key: GEMINI_API_KEY
        sync: false

      - key: GEMINI_TEXT_MODEL
        value: gemini-3.5-flash-lite

      - key: ENV
        value: production

      - key: LOG_LEVEL
        value: INFO

      - key: DATABASE_URL
        fromDatabase:
          name: awa-postgres
          property: connectionString

      - key: REDIS_URL
        fromService:
          name: voxmate-redis
          type: keyvalue
          property: connectionString

      - key: PUBLIC_BASE_URL
        fromService:
          name: voxmate-genai-capstone
          type: web
          envVarKey: RENDER_EXTERNAL_URL

      - key: GOOGLE_REDIRECT_URI
        sync: false

      - key: GITHUB_REDIRECT_URI
        sync: false
